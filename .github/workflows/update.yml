name: Update registry

on:
  schedule:
    - cron: "7,37 * * * *"   # backup only: GitHub often runs these late or skips them; cron-job.org is the real timer (see README)
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button on GitHub, and cron-job.org every 30 min

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Always start from the latest main (a queued run would otherwise start from the
      # commit that triggered it and miss items.json updates from the run before it).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A failure here means something needs a human (see the WARN/error lines). Carry on
      # so the page still gets whatever was checked, and fail the run at the very end.
      - name: Check every item
        id: check
        continue-on-error: true
        run: python update.py

      # Only commit when something real changed (an item sold, appeared, etc.), not just
      # the "last checked" timestamps. The deployed page always gets the fresh file.
      # links.txt changes when update.py expands a share link (posh.mk/...) to the full one.
      - name: Save results
        run: |
          git config user.name "registry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          strip='import json,sys; d=json.load(open(sys.argv[1])); d.pop("updated",None); [i.pop("checked",None) for i in d["items"]]; print(json.dumps(d,sort_keys=True))'
          git show HEAD:docs/items.json > /tmp/old.json
          if [ "$(python -c "$strip" /tmp/old.json)" != "$(python -c "$strip" docs/items.json)" ]; then
            git add docs/items.json
          fi
          git add links.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update item availability"
          fi
          # GitHub switches workflows off after 60 days without a commit. Quiet stretches are
          # normal here, so check in once a month.
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 30 * 86400 )) ]; then
            git commit --allow-empty -m "Monthly check-in (keeps GitHub from pausing updates)"
          fi
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git pull --rebase && git push
          fi

      # The shipping address lives in the SHIP_TO repo secret (Settings → Secrets and
      # variables → Actions) so it's on the published page but never in the repo.
      - name: Add shipping address
        env:
          SHIP_TO: ${{ secrets.SHIP_TO }}
        run: |
          python - <<'EOF'
          import base64, json, os
          addr = os.environ.get("SHIP_TO", "").strip()
          if addr:
              p = "docs/config.json"
              c = json.load(open(p))
              # Scrambled (reversed + base64) so it isn't plain text in the published file;
              # the page decodes it when a guest taps "Show shipping address".
              c["ship_to_hidden"] = base64.b64encode(addr.encode()[::-1]).decode()
              json.dump(c, open(p, "w"), indent=2, ensure_ascii=False)
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report problems
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::The registry needs attention. Open the \"Check every item\" step above for details."
          exit 1
