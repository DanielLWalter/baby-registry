name: Update registry

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (GitHub may start scheduled runs a few minutes late)
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button on GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Always start from the latest main (a queued run would otherwise start from the
      # commit that triggered it and miss items.json updates from the run before it).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every item
        run: python update.py

      # Only commit when something real changed (an item sold, appeared, etc.), not just
      # the "last checked" timestamps. The deployed page always gets the fresh file.
      - name: Save results
        run: |
          git config user.name "registry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          strip='import json,sys; d=json.load(open(sys.argv[1])); d.pop("updated",None); [i.pop("checked",None) for i in d["items"]]; print(json.dumps(d,sort_keys=True))'
          git show HEAD:docs/items.json > /tmp/old.json
          if [ "$(python -c "$strip" /tmp/old.json)" != "$(python -c "$strip" docs/items.json)" ]; then
            git add docs/items.json
            git commit -m "Update item availability"
            git pull --rebase && git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
